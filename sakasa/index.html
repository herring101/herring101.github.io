<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>さかさことば</title>
<meta name="description" content="逆再生された日本語を声でまねして、さかさに戻して当てるゲーム">
<meta name="theme-color" content="#E4E9F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1327" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="さかさことば">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232D52EE'/%3E%3Cpath d='M44 16v32L18 32z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 片手で持つ「さかさ録音機」。460px幅の1カラムに、聞く→まねる→戻すの操作パネルを縦に積む */
:root {
  --shell: #E4E9F1;
  --panel: #F8FAFD;
  --ink: #171F3B;
  --muted: #5A6483;
  --line: #CBD3E2;
  --rev: #2D52EE;
  --rev-soft: #DDE5FF;
  --on-rev: #FFFFFF;
  --rec: #EE3F67;
  --rec-soft: #FFE1E8;
  --sun: #FFC63A;
  --ok: #138A5E;
  --ok-soft: #D5F2E5;
  --bad: #B23A2E;
  --close: #9A6200;
  --shadow: 0 1px 0 rgba(23, 31, 59, .06), 0 10px 24px -14px rgba(23, 31, 59, .35);
  --t1: #4F6BFF; --t2: #EE3F67; --t3: #12A27A; --t4: #F29A1C;
  --t5: #8E5BF0; --t6: #0FA3C4; --t7: #D6497F; --t8: #6C7A2A;

  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell: #0E1327; --panel: #171E3D; --ink: #EDF0FF; --muted: #9BA5C7; --line: #2A3462;
    --rev: #7F98FF; --rev-soft: #233171; --on-rev: #0E1327;
    --rec: #FF6384; --rec-soft: #4A1C2C; --sun: #FFD25C;
    --ok: #43D69E; --ok-soft: #12392D; --bad: #FF8A7A; --close: #FFD25C;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 28px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --shell: #0E1327; --panel: #171E3D; --ink: #EDF0FF; --muted: #9BA5C7; --line: #2A3462;
  --rev: #7F98FF; --rev-soft: #233171; --on-rev: #0E1327;
  --rec: #FF6384; --rec-soft: #4A1C2C; --sun: #FFD25C;
  --ok: #43D69E; --ok-soft: #12392D; --bad: #FF8A7A; --close: #FFD25C;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 28px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--shell); }
body {
  margin: 0;
  background: var(--shell);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--rev); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

#app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
.screen { display: flex; flex-direction: column; gap: 14px; animation: screenIn .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 共通パーツ ---------- */
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sec-title { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }

.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 22px; border-radius: 999px;
  background: var(--ink); color: var(--panel);
  font-weight: 900; font-size: 16px; letter-spacing: .04em;
  transition: transform .12s, opacity .2s;
}
.btn-primary:active { transform: scale(.97); }
.btn-primary[disabled] { opacity: .35; cursor: not-allowed; }
.btn-primary.wide { width: 100%; }
.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--panel); font-weight: 700; font-size: 14px;
}
.btn-ghost:active { transform: scale(.97); }
.link-btn { font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel);
  font-size: 13px; font-weight: 700; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--rev-soft); border-color: var(--rev); color: var(--rev); }
.icon { width: 1.25em; height: 1.25em; flex: none; }

.tiles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; perspective: 600px; }
.tile {
  display: grid; place-items: center; min-width: 44px; height: 50px; padding: 0 6px;
  border-radius: 12px; background: var(--panel); border: 2px solid var(--ink);
  font-family: var(--font-display); font-size: 24px; line-height: 1;
  box-shadow: 0 3px 0 var(--ink);
  backface-visibility: visible;
}
.tiles.sm .tile { min-width: 34px; height: 40px; font-size: 18px; border-radius: 10px; box-shadow: 0 2px 0 var(--ink); }

/* ---------- ホーム ---------- */
.home-top { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 28px; text-align: center; }
.logo-tiles .tile { font-size: 26px; min-width: 46px; height: 54px; }
.logo-tiles .tile:nth-child(-n+3) { background: var(--rev); color: var(--on-rev); border-color: var(--rev); box-shadow: 0 3px 0 color-mix(in srgb, var(--rev) 55%, var(--ink)); }
.tagline { font-size: 14px; color: var(--muted); font-weight: 700; }

.daily-card {
  background: var(--panel); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 14px;
}
.daily-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.daily-title { font-family: var(--font-display); font-size: 22px; line-height: 1.2; }
.daily-no { font-size: 13px; color: var(--muted); font-weight: 700; }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rung {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  height: 56px; border-radius: 12px; border: 1.5px dashed var(--line); color: var(--muted);
  font-size: 11px; font-weight: 700;
}
.rung b { font-family: var(--font-mono); font-size: 16px; color: var(--ink); font-weight: 500; }
.rung.is-now { border: 2px solid var(--ink); color: var(--ink); }
.rung.tier-a { background: var(--rev); border: 0; color: var(--on-rev); }
.rung.tier-b { background: var(--sun); border: 0; color: #2A2205; }
.rung.tier-c { background: color-mix(in srgb, var(--t4) 28%, var(--panel)); border: 0; color: var(--ink); }
.rung.tier-x { background: var(--line); border: 0; color: var(--muted); }
.rung.tier-a b, .rung.tier-b b, .rung.tier-c b, .rung.tier-x b { color: inherit; }
.daily-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; gap: 8px; flex-wrap: wrap; }
.daily-foot b { font-family: var(--font-mono); color: var(--ink); font-weight: 500; }

.how { display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
.how-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; counter-reset: how; }
.how-steps li { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.how-ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; }
.how-ico.rev { background: var(--rev); color: var(--on-rev); }
.how-ico.rec { background: var(--rec); color: #fff; }
.how-ico.fwd { background: var(--ink); color: var(--panel); }
.how-steps b { font-size: 15px; }
.how-steps li > span:last-child { font-size: 12px; color: var(--muted); line-height: 1.5; }
.how-steps b::before { counter-increment: how; content: counter(how) ". "; font-family: var(--font-mono); font-weight: 500; color: var(--muted); }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left;
  padding: 16px; border-radius: var(--r-lg); background: var(--panel); border: 1.5px solid var(--line);
  min-width: 0; transition: transform .12s, border-color .2s;
}
.mode-card:active { transform: scale(.98); }
.mode-card:hover { border-color: var(--ink); }
.mode-card.party { grid-column: 1 / -1; background: var(--ink); color: var(--panel); border-color: var(--ink); }
.mode-card.party .mode-desc { color: color-mix(in srgb, var(--panel) 72%, transparent); }
.mode-title { font-family: var(--font-display); font-size: 18px; line-height: 1.25; }
.mode-desc { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.mode-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sun); color: #2A2205; }
.mode-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px; }
.credits { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.7; padding-top: 6px; }

/* ---------- ヘッダーバー ---------- */
.bar {
  position: sticky; top: 0; z-index: 5;
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px;
  padding-block: 10px 8px; background: var(--shell);
}
.icon-btn { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--line); }
.bar-mid { display: flex; flex-direction: column; min-width: 0; }
.bar-kicker { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-title { font-weight: 900; font-size: 16px; line-height: 1.3; }
.bar-score { display: flex; align-items: baseline; gap: 2px; padding: 4px 12px; border-radius: 999px; background: var(--panel); border: 1.5px solid var(--line); }
.bar-score .num { font-size: 18px; }
.bar-score small { font-size: 11px; color: var(--muted); font-weight: 700; }
.pips { display: flex; gap: 4px; margin-top: 3px; }
.pip { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.pip.on { background: var(--ink); }
.pip.a { background: var(--rev); } .pip.b { background: var(--sun); } .pip.c { background: var(--t4); } .pip.x { background: var(--muted); opacity: .5; }

/* ---------- ステップ・パネル ---------- */
.step {
  position: relative; background: var(--panel); border-radius: var(--r-lg); padding: 14px 14px 16px;
  border: 2px solid transparent; display: flex; flex-direction: column; gap: 12px;
  transition: border-color .25s, opacity .25s;
}
.step.is-active { border-color: var(--ink); box-shadow: var(--shadow); }
.step-label { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 14px; }
.step-no {
  display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
  font-family: var(--font-mono); font-size: 13px; font-weight: 500; background: var(--line); color: var(--ink);
}
.step.is-active .step-no { background: var(--ink); color: var(--panel); }
.step.is-done .step-no { background: var(--ok); color: var(--panel); }
.step-aside { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); }
.q-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); padding: 0 4px; }
.lv-badge { display: inline-flex; align-items: center; gap: 6px; }
.lv-badge b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); border-radius: 6px; padding: 0 6px; }

/* 波形 */
.wave-box { position: relative; height: 78px; border-radius: var(--r-md); background: var(--shell); overflow: hidden; perspective: 800px; }
.wave-box canvas { display: block; width: 100%; height: 100%; }
.wave-box.sm { height: 46px; }
.wave-box.rev canvas { --wave-on: var(--rev); --wave-off: color-mix(in srgb, var(--rev) 32%, var(--shell)); }
.wave-box.fwd canvas { --wave-on: var(--ink); --wave-off: color-mix(in srgb, var(--ink) 25%, var(--shell)); }
.wave-box.rec canvas { --wave-on: var(--rec); --wave-off: color-mix(in srgb, var(--rec) 30%, var(--shell)); }
.dir-tag {
  position: absolute; top: 6px; left: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
  padding: 1px 7px; border-radius: 999px; background: var(--panel); color: var(--muted);
}
.wave-box.rev .dir-tag { color: var(--rev); }
.wave-box.rec .dir-tag { color: var(--rec); }

.deck-ctrl { display: flex; align-items: center; gap: 10px; }
.btn-play {
  display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; flex: none;
  background: var(--rev); color: var(--on-rev); box-shadow: 0 4px 0 color-mix(in srgb, var(--rev) 55%, var(--ink));
  transition: transform .1s, box-shadow .1s;
}
.btn-play:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--rev) 55%, var(--ink)); }
.btn-play.fwd { background: var(--ink); color: var(--panel); box-shadow: 0 4px 0 color-mix(in srgb, var(--ink) 60%, #000); }
.btn-play.sm { width: 44px; height: 44px; box-shadow: 0 3px 0 color-mix(in srgb, var(--rev) 55%, var(--ink)); }
.btn-play.fwd.sm { box-shadow: 0 3px 0 color-mix(in srgb, var(--ink) 60%, #000); }
.btn-play .icon { width: 26px; height: 26px; }
.btn-play.sm .icon { width: 20px; height: 20px; }
.btn-play.is-playing { animation: throb 1s ease-in-out infinite; }
@keyframes throb { 50% { transform: scale(.94); } }
.play-count { font-size: 12px; font-weight: 700; color: var(--muted); margin-left: auto; white-space: nowrap; }
.play-count .num { font-size: 15px; color: var(--ink); }

/* 録音 */
.rec-row { display: flex; align-items: center; gap: 14px; }
.btn-rec {
  position: relative; display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%; flex: none;
  background: var(--panel); border: 3px solid var(--rec); transition: transform .1s;
}
.btn-rec::after { content: ""; width: 44px; height: 44px; border-radius: 50%; background: var(--rec); transition: all .18s; }
.btn-rec:active { transform: scale(.95); }
.btn-rec.is-rec::after { width: 26px; height: 26px; border-radius: 6px; }
.btn-rec.is-rec::before {
  content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--rec);
  animation: ring 1.2s ease-out infinite;
}
@keyframes ring { from { opacity: .7; transform: scale(.9); } to { opacity: 0; transform: scale(1.25); } }
.btn-rec[disabled] { opacity: .35; }
.rec-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.rec-copy b { font-size: 15px; }
.rec-copy span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.rec-timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--rec) !important; letter-spacing: 0 !important; }
.live-box { height: 46px; flex: 1; min-width: 0; }

.take { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1.5px dashed var(--line); }
.take-dir { margin-left: 8px; font-weight: 700; letter-spacing: .04em; }
.take-dir.rev { color: var(--rev); } .take-dir.rec { color: var(--rec); } .take-dir.fwd { color: var(--ink); }
.take-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.take-label { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin-bottom: -4px; }
.take-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.notice {
  font-size: 13px; line-height: 1.6; padding: 10px 12px; border-radius: var(--r-sm);
  background: var(--rec-soft); color: var(--ink);
}
.notice b { color: var(--rec); }

/* 回答 */
.answer-form { display: flex; gap: 8px; }
.answer-form input {
  flex: 1; min-width: 0; height: 52px; padding: 0 16px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--shell); font-size: 18px; font-weight: 700;
}
.answer-form input:focus { outline: none; border-color: var(--ink); background: var(--panel); }
.answer-form .btn-primary { flex: none; min-height: 52px; padding: 0 18px; }
.answer-form.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.answer-meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.lives { display: flex; gap: 3px; margin-right: auto; color: var(--rec); }
.lives .icon { width: 18px; height: 18px; }
.lives .lost { color: var(--line); }
.hint-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 8px 10px; border-radius: 999px; color: var(--ink); background: var(--shell); }
.hint-btn small { color: var(--muted); font-family: var(--font-mono); }
.hint-list { display: flex; flex-direction: column; gap: 6px; }
.hint-item { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; padding: 8px 12px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--sun) 24%, var(--panel)); animation: screenIn .3s; }
.hint-item > span:first-child { flex: none; font-size: 11px; font-weight: 700; color: var(--muted); padding-top: 3px; min-width: 64px; }
.hint-item b { font-weight: 900; }
.boxes { display: inline-flex; gap: 3px; flex-wrap: wrap; vertical-align: middle; }
.boxes i { width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 3px; display: inline-block; }
.sound-chunks { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.sound-chunks span { font-family: var(--font-mono); font-size: 13px; padding: 0 6px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); line-height: 1.6; }
.sound-chunks.rev span { color: var(--rev); border-color: color-mix(in srgb, var(--rev) 40%, var(--line)); }
.sound-chunks .sep { border: 0; background: none; color: var(--muted); padding: 0 2px; }
.guesses { display: flex; flex-wrap: wrap; gap: 6px; }
.guess { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--shell); color: var(--muted); text-decoration: line-through; }
.guess.close { background: color-mix(in srgb, var(--sun) 40%, var(--panel)); color: var(--ink); text-decoration: none; }
.feedback { min-height: 0; font-weight: 900; font-size: 15px; text-align: center; }
.feedback:empty { display: none; }
.feedback.close { color: var(--close); }
.feedback.wrong { color: var(--bad); }

/* 答え発表 */
.reveal { display: flex; flex-direction: column; gap: 16px; background: var(--panel); border-radius: var(--r-lg); padding: 22px 16px; box-shadow: var(--shadow); align-items: stretch; }
.verdict { text-align: center; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.verdict-word { font-family: var(--font-display); font-size: 28px; line-height: 1.2; }
.verdict.good .verdict-word { color: var(--rev); }
.verdict.miss .verdict-word { color: var(--muted); }
.verdict-pts { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.reveal-display { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.reveal-display b { font-family: var(--font-display); font-weight: 400; color: var(--ink); font-size: 20px; line-height: 1.35; text-wrap: balance; }
.reveal-display span { font-size: 12px; font-weight: 700; color: var(--muted); padding: 1px 10px; border-radius: 999px; border: 1.5px solid var(--line); }
.ab { display: flex; flex-direction: column; gap: 8px; }
.ab-row {
  display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 12px; text-align: left;
  padding: 10px 12px; border-radius: var(--r-md); background: var(--shell); min-width: 0;
}
.ab-row .btn-play { pointer-events: none; }
.ab-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ab-text > b { font-size: 12px; letter-spacing: .06em; }
.ab-row.rev .ab-text > b { color: var(--rev); }
.ab-row.mine .ab-text > b { color: var(--rec); }
.ab-row.is-playing { outline: 2px solid var(--ink); }
.explain { overflow-wrap: anywhere; font-size: 13px; color: var(--muted); line-height: 1.7; background: var(--shell); border-radius: var(--r-md); padding: 12px 14px; }
.explain b { color: var(--ink); }

/* ---------- 結果 ---------- */
.result-hero { background: var(--panel); border-radius: var(--r-lg); padding: 22px 18px; box-shadow: var(--shadow); text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.result-total { font-family: var(--font-mono); font-size: 54px; line-height: 1; letter-spacing: -.02em; }
.result-total small { font-size: 18px; color: var(--muted); }
.result-rank { font-family: var(--font-display); font-size: 22px; color: var(--rev); }
.result-emoji { font-size: 26px; letter-spacing: 4px; }
.result-list { display: flex; flex-direction: column; gap: 6px; }
.result-item { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border-radius: var(--r-md); }
.result-item .lvn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.result-item .w { font-weight: 900; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result-item .w small { font-weight: 700; color: var(--muted); margin-left: 6px; font-size: 12px; }
.result-item .p { font-family: var(--font-mono); font-size: 15px; }
.share-box { background: var(--panel); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.share-pre { margin: 0; font-family: var(--font-body); font-size: 14px; line-height: 1.7; white-space: pre-wrap; padding: 12px 14px; border-radius: var(--r-md); background: var(--shell); user-select: all; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > * { flex: 1 1 140px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel); border-radius: var(--r-md); padding: 10px; text-align: center; }
.stat b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 20px; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 700; }

/* ---------- フリープレイ選択 ---------- */
.level-list { display: flex; flex-direction: column; gap: 8px; }
.level-card { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r-lg); background: var(--panel); border: 1.5px solid var(--line); text-align: left; }
.level-card:hover { border-color: var(--ink); }
.level-no { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 14px; background: var(--rev-soft); color: var(--rev); font-family: var(--font-mono); font-size: 20px; }
.level-card b { font-size: 16px; }
.level-card span { display: block; font-size: 12px; color: var(--muted); }
.level-meter { display: flex; gap: 3px; }
.level-meter i { width: 6px; height: 18px; border-radius: 3px; background: var(--line); }
.level-meter i.on { background: var(--rev); }

/* ---------- パーティー ---------- */
.panel { background: var(--panel); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.field-label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); font-size: 22px; font-weight: 700; display: grid; place-items: center; }
.stepper .num { font-size: 32px; min-width: 2ch; text-align: center; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 16px; background: var(--shell); }
.seg button { padding: 10px 8px; border-radius: 12px; font-weight: 700; font-size: 13.5px; line-height: 1.4; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg button small { display: block; font-size: 11px; font-weight: 500; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.players { display: flex; flex-direction: column; gap: 6px; }
.player-input { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; }
.player-input input { font-size: 16px; height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--shell); padding: 0 12px; min-width: 0; font-weight: 700; }
.player-input input:focus { outline: none; border-color: var(--ink); }
.avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; font-family: var(--font-mono); font-size: 14px; flex: none; background: var(--pc, var(--t1)); }
.rules { margin: 0; padding-left: 1.3em; font-size: 13px; color: var(--muted); line-height: 1.8; }
.rules b { color: var(--ink); }

.handoff {
  min-height: calc(100vh - 80px); min-height: calc(100dvh - 80px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
  border-radius: var(--r-lg); margin-top: 16px; padding: 28px 20px;
  background: var(--pc); color: #fff;
}
.handoff .avatar { width: 84px; height: 84px; font-size: 34px; background: rgba(255, 255, 255, .22); }
.handoff h2 { font-family: var(--font-display); font-size: 28px; font-weight: 400; line-height: 1.3; }
.handoff p { font-size: 14px; opacity: .9; }
.handoff .btn-primary { background: #fff; color: #171F3B; }
.turn-tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 900; }
.chain { display: flex; flex-direction: column; gap: 0; }
.chain-row { display: grid; grid-template-columns: 34px 1fr 44px; gap: 12px; align-items: center; padding: 12px 14px; position: relative; border-radius: var(--r-md); }
.chain-row + .chain-row::before { content: ""; position: absolute; left: 30px; top: -10px; height: 20px; border-left: 2px dotted var(--line); }
.chain-row .who { font-size: 11px; font-weight: 700; color: var(--muted); }
.chain-row .what { font-weight: 900; font-size: 18px; line-height: 1.35; word-break: break-all; }
.chain-row .what.same { color: var(--ok); }
.chain-row.is-playing .what { color: var(--rev); }
.chain-origin { background: var(--shell); }
.party-verdict { font-family: var(--font-display); font-size: 26px; text-align: center; line-height: 1.3; }

/* ---------- ラボ ---------- */
.lab-tip { display: flex; flex-wrap: wrap; gap: 6px; }
.lab-tip .chip { color: var(--ink); }
.pal-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pal-table td { padding: 8px 4px; border-top: 1px solid var(--line); vertical-align: top; }
.pal-table td:first-child { font-weight: 900; white-space: nowrap; padding-right: 10px; }
.speed { display: flex; gap: 6px; }

/* トースト */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--panel); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px;
  opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.sheet-back { position: fixed; inset: 0; background: rgba(10, 14, 30, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .2s; }
@keyframes fadeIn { from { opacity: 0; } }
.sheet { width: 100%; max-width: 460px; background: var(--panel); border-radius: 22px 22px 0 0; padding: 22px max(18px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: sheetUp .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { font-size: 18px; font-weight: 900; }
.sheet p { font-size: 14px; color: var(--muted); }

@media (min-width: 420px) {
  .tile { min-width: 48px; height: 54px; font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

</style>

/* ---------- 音声エンジン ---------- */
const AE = (() => {

  function decode(ab) { const c = get(); return new Promise((res, rej) => { const p = c.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); }); }

    for (let ch = 0; ch < buf.numberOfChannels; ch++) { const s = buf.getChannelData(ch), d = out.getChannelData(ch); for (let i = 0, n = s.length; i < n; i++) d[i] = s[n - 1 - i]; }
    return out;
  }
  function trim(d, sr, o = {}) {
    const rel = o.rel ?? 0.07, abs = o.abs ?? 0.005, pre = o.pre ?? 0.04, post = o.post ?? 0.07;
    const f = Math.max(1, Math.floor(sr * 0.01)), n = Math.floor(d.length / f);
    if (n < 3) return { data: new Float32Array(0), peak: 0 };
    const rms = new Float32Array(n); let peak = 0;
    for (let i = 0; i < n; i++) { let s = 0; for (let j = i * f; j < (i + 1) * f; j++) s += d[j] * d[j]; rms[i] = Math.sqrt(s / f); if (rms[i] > peak) peak = rms[i]; }

    let a = 0; while (a < n && rms[a] < thr) a++;

    const out = d.slice(s0, s1), fade = Math.min(Math.floor(sr * 0.006), out.length >> 2);
    for (let i = 0; i < fade; i++) { const g = i / fade; out[i] *= g; out[out.length - 1 - i] *= g; }

  async function prompt(p) {
    if (cache.has(p.id)) return cache.get(p.id);

      const raw = await decode(b64(p.mp3));
      const t = trim(raw.getChannelData(0), raw.sampleRate, { rel: 0.025, abs: 0.001, pre: 0.015, post: 0.03 });

    const c = unlock();
    const src = c.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
    src.connect(c.destination);
    const t0 = c.currentTime + 0.03, dur = buf.duration / rate;

    const tick = () => { if (h.done) return; onProgress && onProgress(Math.min(1, Math.max(0, (c.currentTime - t0) / dur))); h.raf = requestAnimationFrame(tick); };

  }
  function stop() { if (cur) { const h = cur; try { h.src.onended = null; h.src.stop(); } catch (e) { /* 停止済み */ } finish(h, false); } }

  async function startRec({ onLevel, maxSec = 10, onLimit } = {}) {

    const r = { stream, src, proc, mute, chunks: [], len: 0, sr: c.sampleRate, hit: false };

const Waves = new Set();
function peaksOf(buf, n) {
  const d = buf.getChannelData(0), step = d.length / n, out = new Float32Array(n); let mx = 0;
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * step), b = Math.max(a + 1, Math.floor((i + 1) * step)); let s = 0, c = 0;
    for (let j = a; j < b; j += 3) { s += d[j] * d[j]; c++; }

}

  }

const VOWEL_OF = {};
for (const [v, chars] of Object.entries({ a: 'あかさたなはまやらわがざだばぱぁゃゎ', i: 'いきしちにひみりぎじぢびぴぃ', u: 'うくすつぬふむゆるぐずづぶぷぅゅ', e: 'えけせてねへめれげぜでべぺぇ', o: 'おこそとのほもよろをごぞどぼぽぉょ' })) for (const ch of chars) VOWEL_OF[ch] = v;
const VOWEL_KANA = { a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お' };
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function loose(s) {
  s = String(s).normalize('NFKC').replace(/[-‐－―〜~]/g, 'ー').replace(/[\s、。・,.!！?？「」『』（）()…_'"]/g, '');
  s = toHira(s);
  let out = '';
  for (const ch of s) {
    if (ch === 'ー') { const v = VOWEL_OF[out[out.length - 1]]; out += v ? VOWEL_KANA[v] : ''; } else out += ch;
  }
  return out.replace(/を/g, 'お').replace(/ぢ/g, 'じ').replace(/づ/g, 'ず')
    .replace(/([おこそとのほもよろごぞどぼぽょぉ])う/g, '$1お').replace(/([えけせてねへめれげぜでべぺぇ])い/g, '$1え');
}
function lev(a, b) {
  a = [...a]; b = [...b];
  const dp = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = dp[j]; dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return dp[b.length];
}
function judge(guess, answers) {
  const raw = String(guess).normalize('NFKC').replace(/\s/g, '');
  const g = loose(guess);
  if (!g) return { kind: 'empty' };
  const raws = answers.map(a => a.normalize('NFKC').replace(/\s/g, ''));
  const ls = answers.map(loose);
  if (raws.includes(raw) || ls.includes(g)) return { kind: 'correct' };
  const L = [...ls[0]].length;
  const d = Math.min(...ls.filter(x => /^[぀-ゟ]+$/.test(x)).map(x => lev(g, x)));
  return d <= Math.max(1, Math.round(L * 0.25)) ? { kind: 'close', d } : { kind: 'wrong', d };
}

function renderPartyTurn() {
  const i = party.turn, cfg = party.cfg;
  const creator = party.source === 'human' && i === 0;
  const isLast = i === party.n - 1;
  const head = bar({ kicker: `さかさ伝言 · ${i + 1}/${party.n}人目`, title: `<span class="turn-tag"><span class="avatar" style="--pc:${pColor(i)};width:24px;height:24px;font-size:11px">${i + 1}</span>${esc(pName(cfg, i))}</span>` });
  if (creator) {
    const root = mount(`
      ${head}
      <section class="step is-active" data-step="1">
        <div class="step-label"><span class="step-no">1</span>ないしょの言葉を決める</div>
        <div class="answer-form"><input id="party-word" type="text" maxlength="20" placeholder="例：たこやき" aria-label="お題の言葉"></div>
      </section>
      <section class="step" data-step="2">
        <div class="step-label"><span class="step-no">2</span>その言葉を、ふつうに言って録音</div>
        <div data-rec></div>
      </section>
      <button class="btn-primary wide" data-act="next" disabled>つぎの人へわたす</button>`, 'party-turn');
    const word = $('#party-word', root), next = $('[data-act="next"]', root);
    const rec = recorderPanel($('[data-rec]', root), {
      maxSec: 6, labels: { idle: 'タップして録音', idleSub: 'はっきり、ふつうの速さで', back: '次の人が聞く音', raw: 'あなたの声', autoplay: 'back' },
      views: { back: { tag: '◀ さかさ', wave: 'rev', btn: '', icon: 'rev' }, raw: { tag: '▶ ふつう', wave: 'fwd', btn: 'fwd', icon: 'play' } }, onTake: () => check(),
    });
    function check() { next.disabled = !(rec.take() && word.value.trim()); $$('.step', root)[1].classList.toggle('is-active', !!word.value.trim()); $$('.step', root)[0].classList.toggle('is-done', !!word.value.trim()); }
    word.addEventListener('input', check);
    root.addEventListener('click', e => {
      const a = e.target.closest('[data-act]'); if (!a) return;
      if (a.dataset.act === 'back') return sheet({ title: '伝言をやめる？', body: 'ここまでの録音は消えます。', yes: 'やめる', onYes: () => { party = null; renderHome(); } });
      if (a.dataset.act === 'next') {
        const t = rec.take();
        // 吹き込んだ声(順再生)が元の言葉。次の人はそのさかさを聞く
        Object.assign(party, { origText: word.value.trim(), origBuf: t.buf, firstHeard: t.rev });
        party.turn++; renderHandoff();
      }
    });
    return;
  }
  const k = party.source === 'human' ? i - 1 : i;
  const heard = partyHeard(k);
  const root = mount(`
    ${head}
    <section class="step is-active" data-step="1">
      <div class="step-label"><span class="step-no">1</span>このさかさ音声をまねしてね</div>
      <div class="wave-box rev"><span class="dir-tag">◀ ${k === 0 ? 'お題のさかさ' : 'まえの人のまね'}</span><canvas data-w="h"></canvas></div>
      <div class="deck-ctrl"><button class="btn-play" data-act="play" aria-label="再生">${I.rev}</button><span class="play-count"><span class="num" data-plays>0</span> 回きいた</span></div>
    </section>
    <section class="step" data-step="2">
      <div class="step-label"><span class="step-no">2</span>まねして録音 → さかさに戻る</div>
      <div data-rec></div>
    </section>
    <section class="step" data-step="3">
      <div class="step-label"><span class="step-no">3</span>なんて聞こえた？（ないしょでメモ）</div>
      <div class="answer-form"><input id="party-guess" type="text" maxlength="24" placeholder="聞こえた言葉" aria-label="聞こえた言葉"></div>
    </section>
    <button class="btn-primary wide" data-act="next" disabled>${isLast ? '結果発表へ' : 'つぎの人へわたす'}</button>`, 'party-turn');
  const w = new Wave($('[data-w="h"]', root)); w.set(heard);
  let plays = 0;
  const playBtn = $('[data-act="play"]', root), next = $('[data-act="next"]', root), steps = $$('.step', root);
  const rec = recorderPanel($('[data-rec]', root), { maxSec: 10, onTake: () => upd() });
  function upd() {
    const active = !plays ? 1 : !rec.take() ? 2 : 3;
    steps.forEach((s, j) => { s.classList.toggle('is-active', j + 1 === active); s.classList.toggle('is-done', j + 1 < active); });
    next.disabled = !rec.take();
  }
  root.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'back') return sheet({ title: '伝言をやめる？', body: 'ここまでの録音は消えます。', yes: 'やめる', onYes: () => { party = null; renderHome(); } });
    if (act === 'play') {
      if (playBtn.classList.contains('is-playing')) return AE.stop();
      plays++; $('[data-plays]', root).textContent = plays; upd();
      playBtn.classList.add('is-playing'); playBtn.innerHTML = I.stop;
      AE.play(heard, { onProgress: p => w.progress(p), onEnd: () => { playBtn.classList.remove('is-playing'); playBtn.innerHTML = I.rev; w.progress(0); } });
    }
    if (act === 'next') {
      const t = rec.take(); if (!t) return;
      party.chain.push({ player: i, take: t, guess: $('#party-guess', root).value.trim() });
      if (isLast) { party.phase = 'reveal'; renderPartyReveal(); } else { party.turn++; renderHandoff(); }
    }
  });
}
function renderPartyReveal() {
  const cfg = party.cfg;
  const answers = party.prompt ? answersOf(party.prompt) : [party.origText];
  const same = g => !!g && judge(g, answers).kind === 'correct';
  const last = party.chain[party.chain.length - 1];
  const hits = party.chain.filter(c => same(c.guess)).length;
  const verdict = same(last.guess) ? '伝言せいこう！' : hits ? `${hits}人は聞きとれた` : 'ぜんぜん別の言葉に！';
  const origLabel = party.prompt ? `お題（こえ：${esc(party.prompt.voice)}）` : `お題（${esc(pName(cfg, 0))}）`;
  const root = mount(`
    ${bar({ kicker: 'さかさ伝言', title: '結果発表' })}
    <section class="panel">
      <div class="party-verdict">${verdict}</div>
      <div class="chain">
        <div class="chain-row chain-origin" data-row="-1"><span class="avatar" style="--pc:var(--ink)">★</span><span><span class="who">${origLabel}</span><div class="what">${esc(party.origText)}</div></span><button class="btn-play fwd sm" data-play="-1" aria-label="お題を再生">${I.play}</button></div>
        ${party.chain.map((c, j) => `
        <div class="chain-row" data-row="${j}"><span class="avatar" style="--pc:${pColor(c.player)}">${c.player + 1}</span><span><span class="who">${esc(pName(cfg, c.player))} に聞こえた言葉</span><div class="what ${same(c.guess) ? 'same' : ''}">${c.guess ? esc(c.guess) : '<span style="color:var(--muted)">（メモなし）</span>'}</div></span><button class="btn-play fwd sm" data-play="${j}" aria-label="${esc(pName(cfg, c.player))}のまねを戻した声">${I.play}</button></div>`).join('')}
      </div>
      <button class="btn-ghost" data-act="all">${I.play}最初から通して聞く</button>
    </section>
    <p class="tagline" style="padding:0 4px">▶ はそれぞれの<b>まねをさかさに戻した声</b>。どこで言葉が変わったか聞きくらべてね。</p>
    <div class="btn-row"><button class="btn-ghost" data-act="home">ホームへ</button><button class="btn-primary" data-act="again">もう一回</button></div>
  `, 'party-reveal');
  const bufAt = j => j < 0 ? party.origBuf : party.chain[j].take.rev;
  const mark = j => $$('.chain-row', root).forEach(r => r.classList.toggle('is-playing', Number(r.dataset.row) === j));
  let seq = false;
  function playAt(j, then) { mark(j); AE.play(bufAt(j), { onEnd: natural => { mark(null); if (natural && then) then(); } }); }
  function playAll(j = -1) { seq = true; playAt(j, () => { if (seq && j + 1 < party.chain.length) later(() => playAll(j + 1), 450); else seq = false; }); }
  AE.sfx.rewind();
  root.addEventListener('click', e => {
    const pl = e.target.closest('[data-play]'); if (pl) { seq = false; return playAt(Number(pl.dataset.play)); }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'back' || act === 'home') { party = null; return renderHome(); }
    if (act === 'all') return playAll();
    if (act === 'again') { party = null; startParty(); }
  });
}

/* ---------- さかさラボ ---------- */
function renderLab() {
  nav('lab');
  const root = mount(`
    ${bar({ kicker: 'じぶんの声で', title: 'さかさラボ' })}
    <section class="step is-active">
      <div class="step-label"><span class="step-no">1</span>なにか言って録音</div>
      <div class="lab-tip" data-tips>${['自分の名前', 'しんぶんし', 'トマト', 'たけやぶやけた', 'ありがとう'].map(t => `<button class="chip" data-tip="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <div data-rec1></div>
      <div class="speed" data-speedwrap hidden><span class="field-label" style="align-self:center;margin-right:4px">速さ</span>${[0.75, 1, 1.25].map(s => `<button class="chip" data-speed="${s}" aria-pressed="${s === 1}">${s}x</button>`).join('')}</div>
    </section>
    <section class="step" data-s2>
      <div class="step-label"><span class="step-no">2</span>さかさをまねして、元に戻せる？</div>
      <p class="tagline" style="font-size:13px">①のさかさ音声（青い波形）を何度か聞いて、まねして録音。さかさに戻したとき、最初の言葉に聞こえたら成功。</p>
      <div data-rec2></div>
    </section>
    <section class="panel">
      <span class="sec-title">回文は、逆再生でも回文？</span>
      <table class="pal-table"><tbody>
        ${LAB.map(r => `<tr><td>${esc(r.w)}</td><td><div>${chunksHTML(r.fwd)}</div><div style="margin-top:4px">${chunksHTML(r.rev, 'rev')}</div></td></tr>`).join('')}
      </tbody></table>
      <p class="explain">文字では回文でも、音は「子音＋母音」のかたまり。逆再生すると母音が子音の前に来るので、<b>同じ言葉には聞こえません</b>。①で「しんぶんし」を録音して確かめてみて。</p>
    </section>
  `, 'lab');
  let speed = 1;
  const r1 = $('[data-rec1]', root);
  const rec1 = recorderPanel(r1, {
    maxSec: 10, rate: () => speed,
    labels: { idle: 'タップして録音', idleSub: '上のことばを言ってみて', back: 'さかさにした声', raw: 'ふつうの声', autoplay: 'back' },
    views: { back: { tag: '◀ さかさ', wave: 'rev', btn: '', icon: 'rev' }, raw: { tag: '▶ ふつう', wave: 'fwd', btn: 'fwd', icon: 'play' } },
    onTake: () => { $('[data-speedwrap]', root).hidden = false; $('[data-s2]', root).classList.add('is-active'); },
  });
  recorderPanel($('[data-rec2]', root), { maxSec: 10, labels: { idle: 'タップして録音', idleSub: '①のさかさ音声をまねしてね', back: 'まねを戻した声', raw: 'まねした声', autoplay: 'back' } });
  root.addEventListener('click', e => {
    if (e.target.closest('[data-act="back"]')) return renderHome();
    const tip = e.target.closest('[data-tip]');
    if (tip) { $$('[data-tip]', root).forEach(c => c.setAttribute('aria-pressed', c === tip)); if (!AE.recording()) rec1.setCopy(`「${esc(tip.dataset.tip)}」と言ってみよう`, 'タップして録音'); return; }
    const sp = e.target.closest('[data-speed]');
    if (sp) { speed = Number(sp.dataset.speed); $$('[data-speed]', root).forEach(c => c.setAttribute('aria-pressed', c === sp)); rec1.play('back'); }
  });
}

/* ---------- 起動 ---------- */
document.addEventListener('visibilitychange', () => { if (document.hidden) { AE.stop(); } });
route();

</script>
